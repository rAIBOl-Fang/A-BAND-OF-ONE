<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Band of One · 钢琴 C4 长音 A/B</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #11130f; color: #f5f0e5; }
    body { max-width: 1080px; margin: 0 auto; padding: 32px 18px 56px; }
    h1 { margin: 0 0 8px; } h2 { margin: 0 0 8px; font-size: 22px; }
    p { line-height: 1.65; color: #c9c2b2; }
    code { color: #f4c56c; }
    .notice, .panel { border: 1px solid #4c412e; background: #201d16; border-radius: 16px; padding: 18px; margin-top: 18px; }
    .notice { border-left: 4px solid #d89a33; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button { color: #221c12; background: #f4ead9; border: 1px solid #b69a6f; border-radius: 10px; padding: 11px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    button.active { background: #b7e0f1; border-color: #69b5d7; }
    button:focus-visible { outline: 3px solid #efb24d; outline-offset: 2px; }
    .candidates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .candidate { border: 1px solid #4c412e; border-radius: 12px; padding: 14px; cursor: pointer; }
    .candidate.selected { border-color: #efb24d; background: #352817; }
    .candidate strong { display: block; color: #fff5df; font-size: 19px; margin-bottom: 6px; }
    .candidate span { display: block; color: #c9c2b2; line-height: 1.55; }
    .hold { width: min(100%, 560px); min-height: 170px; margin: 22px auto 4px; display: block; font-size: 38px; background: #f4ead9; }
    .hold:active, .hold.active { background: #b7e0f1; transform: translateY(1px); }
    .meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
    .meta div { border-left: 3px solid #d89a33; padding-left: 10px; color: #c9c2b2; }
    .meta strong { display: block; color: #fff5df; font-size: 17px; margin-top: 3px; }
    #status { min-height: 1.6em; color: #a8dfb6; }
    @media (max-width: 700px) { .candidates, .meta { grid-template-columns: 1fr; } .hold { font-size: 30px; } }
  </style>
</head>
<body>
  <h1>钢琴 C4 长音 A/B 试听</h1>
  <p>请先选择 A、B 或 B2，再按住下方“按住发声” 3–5 秒。松开后各方案都立即停止；本页专门比较当前正式循环与两个原始 SFZ 循环候选。</p>
  <p class="notice">这是非破坏性试听：不会覆盖正式 <code>piano_c4.eiad</code>，不会修改固件，也不需要重新烧录。请使用同一电脑音箱或耳机比较 A/B。</p>

  <section class="panel">
    <h2>选择候选方案</h2>
    <div class="candidates" id="candidates" aria-label="钢琴 C4 候选方案"></div>
    <button class="hold" id="hold" type="button">按住发声</button>
    <div class="meta">
      <div>当前候选<strong id="candidate-name">—</strong></div>
      <div>总时长<strong id="total-time">—</strong></div>
      <div>循环区间<strong id="loop-time">—</strong></div>
      <div>文件大小<strong id="file-size">—</strong></div>
    </div>
    <p id="status" role="status">正在读取 A/B 资产清单…</p>
  </section>

  <script id="abo-piano-c4-loop-probe-core">
  (() => {
    const CANDIDATES = {
      piano_c4_baseline: { label: 'A · 当前正式资产', description: '当前键盘正式 EIAD；循环约 1.05 秒。', tone: '基线' },
      piano_c4_sfz_loop: { label: 'B · 原 SFZ 循环修正版', description: '原始 SFZ 稳态循环；1.2 秒起音、120ms 过渡、+6dB 稳态补偿。', tone: 'B' },
      piano_c4_sfz_loop_b2: { label: 'B2 · 原 SFZ 循环 +15dB', description: '与 B 相同，但稳态补偿提高到 +15dB，仍有 −3dBFS 峰值保护。', tone: 'B2' },
    };
    function seconds(samples, rate) { return (samples / rate).toFixed(2) + ' s'; }
    window.AboPianoC4LoopProbeCore = { CANDIDATES, seconds };
  })();
  </script>
  <script>
  (() => {
    const BUNDLE = '../firmware/course-motherboard/abo_assets/delivery/piano-c4-loop-probe/';
    const { CANDIDATES, seconds } = window.AboPianoC4LoopProbeCore;
    const candidates = document.querySelector('#candidates');
    const hold = document.querySelector('#hold');
    const status = document.querySelector('#status');
    const candidateName = document.querySelector('#candidate-name');
    const totalTime = document.querySelector('#total-time');
    const loopTime = document.querySelector('#loop-time');
    const fileSize = document.querySelector('#file-size');
    const steps = [7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,29794,32767];
    const indexChange = [-1,-1,-1,-1,2,4,6,8,-1,-1,-1,-1,2,4,6,8];
    let manifest = new Map();
    let selected = 'piano_c4_baseline';
    let context;
    let active;
    let playToken = 0;
    const cache = new Map();

    function decodeEiad(arrayBuffer) {
      const view = new DataView(arrayBuffer);
      if (String.fromCharCode(...new Uint8Array(arrayBuffer, 0, 4)) !== 'EIAD') throw Error('不是 EIAD 文件');
      const rate = view.getUint32(6, true);
      const frames = view.getUint16(12, true);
      const total = view.getUint32(14, true);
      const output = new Int16Array(total);
      let cursor = 20;
      let written = 0;
      for (let frame = 0; frame < frames; frame += 1) {
        const count = view.getUint16(cursor, true);
        const predictor = view.getInt16(cursor + 2, true);
        cursor += 6;
        output[written++] = predictor;
        const state = { predictor, index: 0 };
        for (let position = 1; position < count; position += 2) {
          const packed = view.getUint8(cursor++);
          for (const code of [packed & 15, packed >> 4]) {
            if (written >= total) break;
            const step = steps[state.index];
            let delta = step >> 3;
            if (code & 4) delta += step;
            if (code & 2) delta += step >> 1;
            if (code & 1) delta += step >> 2;
            state.predictor = Math.max(-32768, Math.min(32767, state.predictor + (code & 8 ? -delta : delta)));
            state.index = Math.max(0, Math.min(88, state.index + indexChange[code]));
            output[written++] = state.predictor;
          }
        }
      }
      return { rate, output };
    }

    async function audioBufferFor(asset) {
      if (cache.has(asset.id)) return cache.get(asset.id);
      context ??= new AudioContext();
      await context.resume();
      const response = await fetch(BUNDLE + asset.file);
      if (!response.ok) throw Error(`${asset.file} HTTP ${response.status}`);
      const decoded = decodeEiad(await response.arrayBuffer());
      const buffer = context.createBuffer(1, decoded.output.length, decoded.rate);
      const channel = buffer.getChannelData(0);
      for (let index = 0; index < channel.length; index += 1) channel[index] = decoded.output[index] / 32768;
      cache.set(asset.id, buffer);
      return buffer;
    }

    function stopActive() {
      if (!active) return;
      const now = context.currentTime;
      active.gain.gain.cancelScheduledValues(now);
      active.gain.gain.setValueAtTime(Math.max(0.0001, active.gain.gain.value), now);
      active.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      active.source.stop(now + 0.14);
      active = null;
      hold.classList.remove('active');
    }

    async function start() {
      const token = ++playToken;
      stopActive();
      const asset = manifest.get(selected);
      if (!asset) return;
      status.textContent = `正在解码 ${CANDIDATES[asset.id].label}…`;
      const buffer = await audioBufferFor(asset);
      if (token !== playToken) return;
      const source = context.createBufferSource();
      const gain = context.createGain();
      source.buffer = buffer;
      source.loop = true;
      source.loopStart = asset.loop_start_sample / buffer.sampleRate;
      source.loopEnd = asset.loop_end_sample / buffer.sampleRate;
      gain.gain.value = 0.95;
      source.connect(gain).connect(context.destination);
      source.start();
      active = { source, gain };
      hold.classList.add('active');
      status.textContent = `${CANDIDATES[asset.id].label}：按住持续播放，松开后 120ms 淡出。`;
      source.addEventListener('ended', () => { if (active && active.source === source) stopActive(); });
    }

    function select(id) {
      playToken += 1;
      stopActive();
      selected = id;
      render();
      const asset = manifest.get(selected);
      if (asset) status.textContent = `${CANDIDATES[id].label} 已选择；按住下方按键试听。`;
    }

    function render() {
      candidates.innerHTML = '';
      for (const [id, info] of Object.entries(CANDIDATES)) {
        const asset = manifest.get(id);
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `candidate${id === selected ? ' selected' : ''}`;
        card.innerHTML = `<strong>${info.label}</strong><span>${info.description}</span>`;
        card.addEventListener('click', () => select(id));
        candidates.append(card);
        if (id === selected && asset) {
          candidateName.textContent = info.tone;
          totalTime.textContent = seconds(asset.total_samples, asset.sample_rate_hz);
          loopTime.textContent = `${seconds(asset.loop_start_sample, asset.sample_rate_hz)}–${seconds(asset.loop_end_sample, asset.sample_rate_hz)}`;
          fileSize.textContent = `${(asset.encoded_bytes / 1024).toFixed(1)} KiB`;
        }
      }
    }

    hold.addEventListener('pointerdown', (event) => { event.preventDefault(); start().catch((error) => { status.textContent = `试听失败：${error.message}`; }); });
    hold.addEventListener('pointerup', (event) => { event.preventDefault(); playToken += 1; stopActive(); });
    hold.addEventListener('pointercancel', () => { playToken += 1; stopActive(); });
    hold.addEventListener('pointerleave', () => { if (active) { playToken += 1; stopActive(); } });
    document.addEventListener('keydown', (event) => { if (event.code === 'Space' && !event.repeat) { event.preventDefault(); start().catch((error) => { status.textContent = `试听失败：${error.message}`; }); } });
    document.addEventListener('keyup', (event) => { if (event.code === 'Space') { event.preventDefault(); playToken += 1; stopActive(); } });

    fetch(BUNDLE + 'manifest.json').then((response) => {
      if (!response.ok) throw Error(`manifest.json HTTP ${response.status}`);
      return response.json();
    }).then((data) => {
      manifest = new Map(data.assets.map((asset) => [asset.id, asset]));
      render();
      status.textContent = '已载入 A、B、B2 三个 C4 资产；请选择方案后按住试听。';
    }).catch((error) => { status.textContent = `初始化失败：${error.message}`; });
  })();
  </script>
</body>
</html>
