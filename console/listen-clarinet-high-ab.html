<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单簧管高音 EIAD A/B</title><style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101522;color:#edf3ff}body{max-width:920px;margin:auto;padding:30px 18px}p{color:#bdc9df;line-height:1.7}.notice,.card{background:#171e2d;border:1px solid #354765;border-radius:14px;padding:16px;margin-top:16px}.notice{border-left:4px solid #eeb94a;background:#201c12}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}button{margin:6px 5px 0 0;padding:9px;border:1px solid #6581aa;border-radius:8px;background:#edf5ff;color:#172139;font-weight:700;cursor:pointer}button.b{background:#b9edc3}button.stop{background:#41262b;color:#ffe9e9;border-color:#bc6973}code{color:#9be0ff}@media(max-width:720px){.cards{grid-template-columns:1fr}}
</style></head><body><h1>单簧管高音 EIAD A/B</h1><p>比较的是两套已编码 EIAD：A 为当前可辨识基线；B1 仅替换 D5/F5/A#5 的原始片段。先听“单次”判断编码音色，再听“循环”判断接缝；两者均不改当前基线包。</p><p class="notice">请从 D5 开始，同一音按 A 单次 → B1 单次 → A 循环 → B1 循环的顺序比较，并反馈每音更好的版本或“无差异”。</p><div id="cards" class="cards"></div><button id="stop" class="stop" type="button">停止</button><p id="status">正在读取两套清单…</p>
<script id="abo-clarinet-high-ab-core">(()=>{const COMPARE_NOTES=['D5','F5','A#5'],MODES=['one-shot','loop'];function loopBounds(asset){return [asset.loop_start_sample/asset.sample_rate_hz,asset.loop_end_sample/asset.sample_rate_hz]}window.AboClarinetHighAbCore={COMPARE_NOTES,MODES,loopBounds};})();</script>
<script>(()=>{const A='../firmware/course-motherboard/abo_assets/delivery/clarinet-tonejs-preview/',B='../firmware/course-motherboard/abo_assets/delivery/clarinet-tonejs-high-ab-preview/';const {COMPARE_NOTES,loopBounds}=window.AboClarinetHighAbCore,cards=document.querySelector('#cards'),status=document.querySelector('#status');let ctx,active;const steps=[7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,29794,32767],indexChange=[-1,-1,-1,-1,2,4,6,8,-1,-1,-1,-1,2,4,6,8];function decode(buffer){const v=new DataView(buffer),magic=String.fromCharCode(...new Uint8Array(buffer,0,4));if(magic!=='EIAD')throw Error('不是 EIAD');const rate=v.getUint32(6,true),frames=v.getUint16(12,true),total=v.getUint32(14,true),out=new Int16Array(total);let c=20,w=0;for(let f=0;f<frames;f++){const n=v.getUint16(c,true),pred=v.getInt16(c+2,true);c+=6;out[w++]=pred;let p=pred,i=0;for(let k=1;k<n;k+=2){const packed=v.getUint8(c++);for(const code of [packed&15,packed>>4]){if(w>=total||w% n===0)break;const step=steps[i];let d=step>>3;if(code&4)d+=step;if(code&2)d+=step>>1;if(code&1)d+=step>>2;p=Math.max(-32768,Math.min(32767,p+(code&8?-d:d)));i=Math.max(0,Math.min(88,i+indexChange[code]));out[w++]=p}}}return{rate,out}}function stop(){if(active){active.stop();active=null}}async function play(dir,asset,label,loop){stop();status.textContent='正在解码 '+label+'…';const r=await fetch(dir+asset.file);if(!r.ok)throw Error('HTTP '+r.status);const d=decode(await r.arrayBuffer());ctx??=new AudioContext();const b=ctx.createBuffer(1,d.out.length,d.rate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=d.out[i]/32768;const s=ctx.createBufferSource();s.buffer=b;s.loop=loop;if(loop){[s.loopStart,s.loopEnd]=loopBounds(asset)}s.connect(ctx.destination);active=s;s.start();status.textContent=label+(loop?'：循环试听':'：单次试听')}async function main(){const [ma,mb]=await Promise.all([fetch(A+'manifest.json').then(r=>r.json()),fetch(B+'manifest.json').then(r=>r.json())]);for(const note of COMPARE_NOTES){const aa=ma.assets.find(x=>x.root_note===note),bb=mb.assets.find(x=>x.root_note===note),card=document.createElement('section');card.className='card';card.innerHTML='<h2>'+note+'</h2>';for(const [name,dir,asset,klass] of [['A 基线',A,aa,''],['B1 新片段',B,bb,'b']])for(const loop of [false,true]){const q=document.createElement('button');q.className=klass;q.textContent=name+(loop?' · 循环':' · 单次');q.onclick=()=>play(dir,asset,q.textContent,loop).catch(e=>status.textContent='失败：'+e.message);card.append(q)}cards.append(card)}status.textContent='两套 A/B 清单已载入。'}document.querySelector('#stop').onclick=()=>{stop();status.textContent='已停止。'};main().catch(e=>status.textContent='初始化失败：'+e.message)})();</script></body></html>
