<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Band of One · 分区弦乐原件试听</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background:#101522; color:#edf3ff; }
    body { max-width:1040px; margin:0 auto; padding:30px 18px 48px; }
    p { color:#b8c4d9; line-height:1.7; } code { color:#9be0ff; }
    .notice,.panel { border:1px solid #31405b; border-radius:14px; padding:16px; margin-top:18px; background:#171e2d; }
    .notice { border-left:4px solid #eeb94a; background:#201c12; }
    #zones { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .zone { border:1px solid #40536f; border-radius:12px; padding:14px; } .zone strong { display:block; font-size:18px; }
    #notes { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; margin-top:14px; }
    button { padding:12px 8px; border-radius:10px; border:1px solid #5e759d; background:#eaf2ff; color:#172239; font-weight:700; font-size:16px; cursor:pointer; }
    button:hover,button.active { background:#92d7ee; } #stop { margin-top:14px; background:#38252b; border-color:#c86c75; color:#ffe9e9; }
    #status { min-height:1.7em; color:#a9e7b8; } @media (max-width:720px){#zones{grid-template-columns:1fr}#notes{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <h1>分区弦乐 · 原件试听</h1>
  <p>这是源音核验页：只读取三枚原始 WAV，一次性播放；<strong>不压缩、不裁切、不循环、不写入固件</strong>。点击目标音时，浏览器按对应音区的根音实时变调。</p>
  <p class="notice">请通过本地静态服务器访问：<code>http://127.0.0.1:8800/console/listen-strings-source-preview.html</code>。直接双击页面会被浏览器拦截读取 WAV。</p>
  <section class="panel"><h2>分区来源</h2><div id="zones"></div></section>
  <section class="panel"><h2>21 个目标音</h2><div id="notes" aria-label="弦乐目标音"></div><button id="stop" type="button" disabled>停止播放</button><p id="status" role="status">正在读取三件原始 WAV…</p></section>

  <script id="abo-strings-source-preview-core">
  (() => {
    const CHROMATIC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const ROOTS = [
      { root:'C3', instrument:'大提琴', zone:'低音区 C3–B3', file:'susvib_C3_v1_1.wav', source:'Cello Section susvib' },
      { root:'C4', instrument:'中提琴', zone:'中音区 C4–B4', file:'ViolaEns_susvib_C4_v1_1.wav', source:'Viola Section susvib' },
      { root:'C5', instrument:'小提琴', zone:'高音区 C5–B5', file:'LLVln_ArcoVib_C5_f.wav', source:'Solo Violin Arco Vib' },
    ];
    const noteNumber = (note) => { const match = /^([A-G]#?)(\d)$/.exec(note); if (!match) throw new Error(`不支持的音名：${note}`); return (Number(match[2]) + 1) * 12 + CHROMATIC.indexOf(match[1]); };
    function mapTarget(target) {
      const number = noteNumber(target);
      if (number < noteNumber('C3') || number > noteNumber('B5')) throw new Error(`目标音超出 C3–B5：${target}`);
      const root = ROOTS[Math.floor((number - noteNumber('C3')) / 12)];
      return { target, root:root.root, instrument:root.instrument, zone:root.zone, semitones:number - noteNumber(root.root), file:root.file, source:root.source };
    }
    window.AboStringsSourcePreviewCore = { ROOTS, mapTarget };
  })();
  </script>
  <script>
  (() => {
    const BUNDLE = '../firmware/course-motherboard/abo_assets/raw/strings-vsco-zoned/';
    const { ROOTS, mapTarget } = window.AboStringsSourcePreviewCore;
    const zones = document.querySelector('#zones'), notes = document.querySelector('#notes'), status = document.querySelector('#status'), stop = document.querySelector('#stop');
    let context, activeSource; const buffers = new Map();
    function stopActive(){ if(activeSource){activeSource.stop();activeSource=null;} stop.disabled=true; notes.querySelectorAll('button').forEach((button)=>button.classList.remove('active')); }
    async function load(root){ if(buffers.has(root.file)) return buffers.get(root.file); const response=await fetch(BUNDLE+root.file); if(!response.ok) throw new Error(`无法读取 ${root.file}（HTTP ${response.status}）`); context ??= new AudioContext(); const buffer=await context.decodeAudioData(await response.arrayBuffer()); buffers.set(root.file,buffer); return buffer; }
    async function play(target, button){ stopActive(); const mapped=mapTarget(target); const root=ROOTS.find((item)=>item.root===mapped.root); status.textContent=`正在读取 ${mapped.instrument} ${mapped.root} 原件…`; const buffer=await load(root); const source=context.createBufferSource(); source.buffer=buffer; source.playbackRate.value=2 ** (mapped.semitones / 12); source.connect(context.destination); source.addEventListener('ended',()=>{if(activeSource===source)stopActive();}); activeSource=source; source.start(); button.classList.add('active'); stop.disabled=false; status.textContent=`${target}：${mapped.zone}，${mapped.instrument} ${mapped.root}，${mapped.semitones >= 0 ? '+' : ''}${mapped.semitones} 半音；一次性原件试听。`; }
    for(const root of ROOTS){ const card=document.createElement('div'); card.className='zone'; card.innerHTML=`<strong>${root.zone}</strong>${root.instrument} · 根音 ${root.root}<br><small>${root.source}</small>`; zones.append(card); }
    for(let octave=3;octave<=5;octave+=1){ for(const solfege of [['do','C'],['re','D'],['mi','E'],['fa','F'],['sol','G'],['la','A'],['xi','B']]){ const target=`${solfege[1]}${octave}`; const button=document.createElement('button'); button.type='button'; button.innerHTML=`${solfege[0]}<br><small>${target}</small>`; button.addEventListener('click',()=>play(target,button).catch((error)=>{status.textContent=`读取失败：${error.message}`; stopActive();})); notes.append(button); } }
    stop.addEventListener('click',stopActive);
  })();
  </script>
</body>
</html>
