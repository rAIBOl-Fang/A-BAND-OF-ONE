<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">EasyInput Maker</title>
  <desc id="desc">EasyInput V2.0 community firmware map: eight keys and an encoder feed an ESP32-S3 firmware core, which connects to USB and Bluetooth input, five addressable lights, microphone networking, speaker output, and an AI-assisted test-build-flash workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.58" stop-color="#0b2030"/>
      <stop offset="1" stop-color="#102b35"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48d6c5"/>
      <stop offset="1" stop-color="#b7e35b"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#background)"/>
  <circle cx="1060" cy="18" r="210" fill="#174453" opacity="0.24"/>
  <circle cx="112" cy="472" r="170" fill="#11394a" opacity="0.28"/>

  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="68" y="92" fill="#f7fbfc" font-size="66" font-weight="760" letter-spacing="-2">EasyInput Maker</text>
    <text x="71" y="137" fill="#c2d4dc" font-size="24">完整固件基线 · AI 修改 · 可验证共创</text>
    <text x="1130" y="89" fill="#7fe1d6" font-size="17" font-weight="650" text-anchor="end">EASYINPUT V2.0 · ESP32-S3</text>
  </g>

  <g transform="translate(66 178)">
    <path d="M24 0 H1028 Q1052 0 1052 24 V188 Q1052 212 1028 212 H24 Q0 212 0 188 V24 Q0 0 24 0Z"
          fill="#0a1b28" stroke="#315465" stroke-width="2"/>
    <path d="M22 18 H1030" stroke="#173546" stroke-width="2"/>
    <text x="28" y="42" fill="#7898a7"
          font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="13">PUBLIC FIRMWARE CONTROL SURFACE</text>

    <g transform="translate(30 58)">
      <g fill="#102b3a" stroke="#4fd7c6" stroke-width="2">
        <rect width="60" height="48" rx="10"/>
        <rect x="70" width="60" height="48" rx="10"/>
        <rect x="140" width="60" height="48" rx="10"/>
        <rect x="210" width="60" height="48" rx="10"/>
        <rect y="60" width="60" height="48" rx="10"/>
        <rect x="70" y="60" width="60" height="48" rx="10"/>
        <rect x="140" y="60" width="60" height="48" rx="10"/>
        <rect x="210" y="60" width="60" height="48" rx="10"/>
      </g>
      <g fill="#c9f3ee"
         font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
         font-size="13" text-anchor="middle">
        <text x="30" y="30">S1</text><text x="100" y="30">S2</text>
        <text x="170" y="30">S3</text><text x="240" y="30">S4</text>
        <text x="30" y="90">S5</text><text x="100" y="90">S6</text>
        <text x="170" y="90">S7</text><text x="240" y="90">S8</text>
      </g>

      <g transform="translate(329 54)">
        <circle r="48" fill="#102a38" stroke="#b7e35b" stroke-width="3"/>
        <circle r="34" fill="none" stroke="#355365" stroke-width="2" stroke-dasharray="3 7"/>
        <path d="M0 0 V-30" stroke="#d9f58e" stroke-width="5" stroke-linecap="round"/>
        <circle r="7" fill="#b7e35b"/>
        <text y="72" fill="#9db4bf"
              font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
              font-size="12" text-anchor="middle">ENCODER</text>
      </g>
    </g>

    <path d="M442 112 H518" stroke="#48d6c5" stroke-width="5" stroke-linecap="round"/>
    <path d="M503 99 L520 112 L503 125" fill="none" stroke="#48d6c5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(538 54)">
      <rect width="190" height="118" rx="20" fill="#f5faf9"/>
      <rect x="14" y="14" width="162" height="90" rx="14" fill="#0c2432"/>
      <text x="95" y="53" fill="#f5faf9"
            font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
            font-size="22" font-weight="720" text-anchor="middle">ESP32-S3</text>
      <text x="95" y="78" fill="#65ddd0"
            font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="12" text-anchor="middle">FULL SOURCE BASELINE</text>
      <g stroke="#a4bac4" stroke-width="3">
        <path d="M-11 28 H14 M-11 51 H14 M-11 74 H14 M-11 97 H14"/>
        <path d="M176 28 H201 M176 51 H201 M176 74 H201 M176 97 H201"/>
      </g>
    </g>

    <path d="M750 112 H790" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(808 48)"
       font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <path d="M0 20 H30 M0 64 H30 M0 108 H30" stroke="#6cded1" stroke-width="3"/>
      <circle cx="0" cy="20" r="5" fill="#48d6c5"/>
      <circle cx="0" cy="64" r="5" fill="#7ddfa7"/>
      <circle cx="0" cy="108" r="5" fill="#b7e35b"/>
      <text x="45" y="26" fill="#e6f2f3" font-size="18" font-weight="650">USB · BLE HID</text>
      <text x="45" y="70" fill="#e6f2f3" font-size="18" font-weight="650">MIC · Wi-Fi · SPEAKER</text>
      <text x="45" y="114" fill="#e6f2f3" font-size="18" font-weight="650">5× WS2812 · POWER</text>
    </g>

    <g transform="translate(560 190)">
      <circle cx="0" r="7" fill="#48d6c5"/>
      <circle cx="28" r="7" fill="#62dcc2"/>
      <circle cx="56" r="7" fill="#7ddfa7"/>
      <circle cx="84" r="7" fill="#9ee278"/>
      <circle cx="112" r="7" fill="#b7e35b"/>
    </g>
  </g>

  <path d="M198 429 H1002" stroke="#2d5260" stroke-width="2"/>
  <path d="M198 429 H1002" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
     font-size="14" font-weight="650" text-anchor="middle">
    <text x="198" y="456" fill="#70ded2">需求</text>
    <text x="360" y="456" fill="#70ded2">AI 修改</text>
    <text x="522" y="456" fill="#8ee0a0">HOST TEST</text>
    <text x="684" y="456" fill="#a8e276">IDF BUILD</text>
    <text x="846" y="456" fill="#d8e993">FLASH</text>
    <text x="1002" y="456" fill="#f0c674">实板观察</text>
  </g>
  <g fill="#b7e35b">
    <circle cx="198" cy="429" r="5"/><circle cx="360" cy="429" r="5"/>
    <circle cx="522" cy="429" r="5"/><circle cx="684" cy="429" r="5"/>
    <circle cx="846" cy="429" r="5"/>
  </g>
  <circle cx="1002" cy="429" r="7" fill="#f0c674"/>
</svg>
